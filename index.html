<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA FC League - Predictions</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0a0e14;
      --card-bg: #121824;
      --accent-green: #00ff87;
      --text-white: #f8fafc;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    h1 { text-align: center; color: var(--text-white); font-weight: 900; letter-spacing: 1px; font-size: 2.2rem; margin-bottom: 10px; }
    h1 span { color: var(--accent-green); }

    /* Navigation Bar */
    .nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .nav a { color: var(--text-white); text-decoration: none; padding: 10px 18px; background: var(--card-bg); border-radius: 6px; font-weight: bold; border: 1px solid var(--border-color); transition: all 0.2s; font-size: 14px; }
    .nav a.active { background: var(--accent-green); color: #000; border-color: var(--accent-green); }
    .nav a:hover:not(.active) { border-color: var(--accent-green); }

    .card { background: var(--card-bg); border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .hidden { display: none; }
    
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #94a3b8; }
    input[type="text"], input[type="password"], input[type="number"] { padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #06090e; color: #fff; width: 100%; margin-bottom: 15px; font-size: 15px; }
    button { background: var(--accent-green); color: #000; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: background 0.2s; text-transform: uppercase; }
    button:hover { background: #00cc6a; }
    
    .match-card { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border-color); gap: 10px; }
    .team { flex: 1; text-align: center; font-weight: bold; }
    .score-input { width: 50px !important; text-align: center; margin-bottom: 0 !important; }
    .logout-btn { background: #ef4444; color: white; margin-top: 15px; }
    .logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <h1>EA SPORTS <span>FC LEAGUE</span></h1>

    <div class="nav">
      <a href="index.html" class="active">Predictions</a>
      <a href="standings.html">Standings</a>
      <a href="matches.html">Matches</a>
    </div>

    <!-- Login Card -->
    <div id="login-section" class="card">
      <h2 style="margin-top:0; color:var(--accent-green);">Sign In</h2>
      <label>Username</label>
      <input type="text" id="username-input" placeholder="Enter username (e.g., Desoky)">
      
      <label>Password</label>
      <input type="password" id="password-input" placeholder="Enter password">
      
      <button onclick="login()">Login</button>
      <p id="login-error" style="color:#ef4444; margin-top:10px; display:none; text-align:center; font-weight:bold;"></p>
    </div>

    <!-- Predictions Card -->
    <div id="predictions-section" class="card hidden">
      <h2>Welcome, <span id="user-display-name" style="color: var(--accent-green);"></span> 👋</h2>
      <p style="color:#94a3b8;">Submit your match predictions below:</p>
      <div id="matches-list">Loading matches...</div>
      <button onclick="savePredictions()" style="margin-top: 20px;">Save Predictions 💾</button>
      <button onclick="logout()" class="logout-btn">Logout</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
