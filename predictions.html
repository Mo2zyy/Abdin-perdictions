<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTIMATE TEAM LEAGUE - Predictions</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg-dark: #0a0e14;
      --card-bg: rgba(18, 24, 36, 0.90);
      --accent-green: #00ff87;
      --text-white: #f8fafc;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); margin: 0; padding: 20px; position: relative; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
    
    h1 { text-align: center; color: var(--text-white); font-weight: 900; letter-spacing: 1px; font-size: 2.2rem; margin-bottom: 10px; }
    h1 span { color: var(--accent-green); }
    h2 { text-align: center; color: var(--accent-green); margin-bottom: 20px; text-transform: uppercase; font-size: 1.4rem; }
    
    .nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .nav a { color: var(--text-white); text-decoration: none; padding: 10px 18px; background: var(--card-bg); border-radius: 6px; font-weight: bold; border: 1px solid var(--border-color); transition: all 0.2s; font-size: 14px; backdrop-filter: blur(5px); }
    .nav a.active { background: var(--accent-green); color: #000; border-color: var(--accent-green); }
    .nav a:hover:not(.active) { border-color: var(--accent-green); }

    .predictions-grid { display: flex; flex-direction: column; gap: 15px; }
    .match-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; backdrop-filter: blur(10px); }
    .teams-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; }
    .team-info { display: flex; align-items: center; gap: 8px; }
    .team-logo { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent-green); background: #000; object-fit: contain; }
    
    .inputs-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
    .pred-input { width: 50px; height: 40px; text-align: center; font-size: 18px; font-weight: bold; background: #06090e; color: var(--accent-green); border: 1px solid var(--border-color); border-radius: 6px; }
    .submit-btn { background: var(--accent-green); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: opacity 0.2s; }
    .submit-btn:hover { opacity: 0.9; }

    /* Background Slideshow (.jpg) */
    .bg-slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
    .bg-slideshow div { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; animation: slideAnimation 28s infinite; filter: brightness(0.35); }

    .bg-slideshow div:nth-child(1) { background-image: url('./ahd1.png'); animation-delay: 0s; }
    .bg-slideshow div:nth-child(2) { background-image: url('./angle2.png'); animation-delay: 4s; }
    .bg-slideshow div:nth-child(3) { background-image: url('./desoky3.png'); animation-delay: 8s; }
    .bg-slideshow div:nth-child(4) { background-image: url('./eslam4.png'); animation-delay: 12s; }
    .bg-slideshow div:nth-child(5) { background-image: url('./kamal5.png'); animation-delay: 16s; }
    .bg-slideshow div:nth-child(6) { background-image: url('./loay6.png'); animation-delay: 20s; }
    .bg-slideshow div:nth-child(7) { background-image: url('./seif7.png'); animation-delay: 24s; }

    @keyframes slideAnimation {
      0% { opacity: 0; } 5% { opacity: 1; } 17% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bg-slideshow">
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>

  <div class="container">
    <h1>ULTIMATE TEAM <span>LEAGUE</span></h1>
    
    <div class="nav">
      <a href="index.html">Standings</a>
      <a href="predictions.html" class="active">Predictions</a>
      <a href="matches.html">Matches</a>
    </div>

    <h2>🔮 PREDICT MATCHES</h2>
    <div class="predictions-grid" id="predictions-container">
      <div style="text-align:center;">Loading Upcoming Matches...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ffdltukfzqxqrcpvrxxe.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZGx0dWtmenF4cXJjcHZyeHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDc5NDQsImV4cCI6MjEwNTgyMzk0NH0.utVnf2aOG9yxRZoYlAoziDH_LY3Bvd3KkkmcwdY-IoY';
    
    let db;

    const TEAM_LOGOS = {
      'Ahd': './ahd.png',
      'Angle': './Angle.png',
      'Desoky': './desoky.png',
      'Eslam': './eslam.png',
      'Kamal': 'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg',
      'Loay': 'https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg',
      'Seif': './seif.png'
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (window.supabase) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        loadUpcomingMatches();
      }
    });

    async function loadUpcomingMatches() {
      try {
        if (!db) return;
        
        // جلب الماتشات غير المنتهية فقط
        const { data: matches, error } = await db.from('matches').select('*');
        if (error || !matches) return;

        // دمج الماتشات المكررة بنفس الاسم لحل مشكلة التكرار
        const uniqueMatchesMap = new Map();

        matches.forEach(m => {
          if (m.home_score === null || m.home_score === undefined) {
            const key = `${m.home_team}_vs_${m.away_team}`;
            if (!uniqueMatchesMap.has(key)) {
              uniqueMatchesMap.set(key, m);
            }
          }
        });

        const uniqueMatches = Array.from(uniqueMatchesMap.values());

        if (uniqueMatches.length === 0) {
          document.getElementById('predictions-container').innerHTML = '<div style="text-align:center;">No upcoming matches to predict.</div>';
          return;
        }

        let html = '';
        uniqueMatches.forEach(m => {
          const homeLogo = TEAM_LOGOS[m.home_team] ? `<img src="${TEAM_LOGOS[m.home_team]}" class="team-logo">` : '';
          const awayLogo = TEAM_LOGOS[m.away_team] ? `<img src="${TEAM_LOGOS[m.away_team]}" class="team-logo">` : '';

          html += `
            <div class="match-card">
              <div class="teams-header">
                <div class="team-info">${homeLogo} <span>${m.home_team}</span></div>
                <span>VS</span>
                <div class="team-info"><span>${m.away_team}</span> ${awayLogo}</div>
              </div>
              <div class="inputs-container">
                <input type="number" id="pred_home_${m.id}" class="pred-input" min="0" placeholder="0">
                <span>-</span>
                <input type="number" id="pred_away_${m.id}" class="pred-input" min="0" placeholder="0">
              </div>
              <button class="submit-btn" onclick="submitPrediction(${m.id})">Save Prediction</button>
            </div>
          `;
        });

        document.getElementById('predictions-container').innerHTML = html;

      } catch (err) {
        console.error(err);
      }
    }

    async function submitPrediction(matchId) {
      const homeVal = document.getElementById(`pred_home_${matchId}`).value;
      const awayVal = document.getElementById(`pred_away_${matchId}`).value;

      if (homeVal === '' || awayVal === '') {
        alert('Please enter scores for both teams.');
        return;
      }

      alert('Prediction saved successfully!');
    }
  </script>
</body>
</html>
