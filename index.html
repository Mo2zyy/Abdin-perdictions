<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Team League - التوقعات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    
    /* تنسيق أزرار التنقل الجديدة */
    .nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
    .nav a { color: #fff; text-decoration: none; padding: 10px 20px; background: #1e293b; border-radius: 8px; font-weight: bold; border: 1px solid #334155; }
    .nav a.active { background: #0284c7; border-color: #38bdf8; }

    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .hidden { display: none; }
    input[type="text"], input[type="number"] { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; width: 100%; }
    button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button:hover { background: #0369a1; }
    .match-card { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #334155; gap: 10px; }
    .team { flex: 1; text-align: center; font-weight: bold; }
    .score-input { width: 50px !important; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 Ultimate Team League</h1>

    <!-- أزرار التنقل بين الصفحات -->
    <div class="nav">
      <a href="index.html" class="active">صفحة التوقعات</a>
      <a href="standings.html">جدول الترتيب والمباريات</a>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-section" class="card">
      <h2>تسجيل الدخول / إنشاء حساب</h2>
      <p>أدخل اسمك للمتابعة:</p>
      <input type="text" id="username-input" placeholder="مثال: Desoky">
      <button onclick="login()">دخول</button>
    </div>

    <!-- شاشة التوقعات -->
    <div id="predictions-section" class="card hidden">
      <h2>مرحباً <span id="user-display-name" style="color: #38bdf8;"></span> 👋</h2>
      <p>أدخل توقعاتك للمباريات القادمة:</p>
      <div id="matches-list">جاري تحميل المباريات...</div>
      <button onclick="savePredictions()" style="margin-top: 20px; background: #22c55e;">حفظ التوقعات 💾</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
