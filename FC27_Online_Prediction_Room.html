<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FC27 Prediction Room</title>
<style>
body{margin:0;background:#06100e;color:#eef8f3;font-family:Arial,sans-serif}*{box-sizing:border-box}
.wrap{max-width:900px;margin:auto;padding:16px}.hero,.card{background:#0a1915;border:1px solid #176348;border-radius:18px;padding:18px;margin-bottom:14px}
h1{margin:0;color:#f3c95b}.sub{color:#9bb8ad}.row{display:flex;gap:8px;flex-wrap:wrap}.input{background:#06100e;color:#fff;border:1px solid #285c4c;border-radius:10px;padding:11px;flex:1;min-width:140px}
button{border:0;border-radius:10px;padding:11px 15px;background:#13c47d;font-weight:bold;cursor:pointer}.secondary{background:#19382e;color:#fff}
.msg{padding:10px;background:#10251f;border-radius:10px;color:#b8d5ca;margin-top:10px}.match{display:grid;grid-template-columns:1fr 120px 1fr;gap:10px;align-items:center;border-top:1px solid #15382e;padding:12px 0}.team{font-weight:bold}.home{text-align:right}.away{text-align:left}.score{width:46px;padding:10px;text-align:center;background:#06100e;border:1px solid #285c4c;border-radius:8px;color:white;font-size:17px}.center{text-align:center}.hide{display:none}.round{margin-top:12px}.badge{background:#123127;color:#63dfaa;padding:5px 9px;border-radius:99px;font-size:12px}@media(max-width:600px){.match{grid-template-columns:1fr 105px 1fr}.team{font-size:13px}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><h1>🏆 FC27 ULTIMATE TEAM</h1><div class="sub">Prediction Room • 7 Players • 42 Matches</div></div>

<div id="login" class="card">
<h2>ادخل البطولة</h2>
<div class="row"><input id="name" class="input" placeholder="اسمك"><input id="room" class="input" placeholder="Room Code (مثال FC27)" value="FC27"></div>
<div class="row" style="margin-top:8px"><button onclick="create()">إنشاء/دخول الروم</button></div>
<div id="status" class="msg">مهم: النسخة دي تعمل P2P؛ صاحب الروم لازم يفضل فاتح الصفحة عشان الاتصال يظل قائمًا.</div>
</div>

<div id="app" class="hide">
<div class="card"><div class="row"><b id="roomTitle"></b><span class="badge" id="role"></span><span class="badge" id="peer"></span></div>
<div class="msg">كل لاعب له توقعاته الخاصة. اضغط «إرسال» بعد التعديل. التوقعات تُرسل مباشرة للطرف الآخر.</div>
<div class="row" style="margin-top:8px"><button onclick="sendAll()">إرسال كل التوقعات</button><button class="secondary" onclick="copyInvite()">نسخ كود الروم</button></div></div>
<div id="rounds"></div>
<div class="card"><h2>👥 حالة اللاعبين</h2><div id="players">بانتظار الاتصال...</div></div>
</div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const rounds=[
[["Desoky","Seif"],["Angle","Eslam"],["Loay","Ahd"]],
[["Kamal","Desoky"],["Seif","Loay"],["Ahd","Eslam"]],
[["Kamal","Angle"],["Desoky","Loay"],["Eslam","Seif"]],
[["Loay","Kamal"],["Angle","Ahd"],["Eslam","Desoky"]],
[["Ahd","Kamal"],["Loay","Eslam"],["Seif","Angle"]],
[["Eslam","Kamal"],["Ahd","Seif"],["Desoky","Angle"]],
[["Kamal","Seif"],["Desoky","Ahd"],["Loay","Angle"]],
[["Seif","Desoky"],["Eslam","Angle"],["Ahd","Loay"]],
[["Desoky","Kamal"],["Loay","Seif"],["Eslam","Ahd"]],
[["Angle","Kamal"],["Loay","Desoky"],["Seif","Eslam"]],
[["Kamal","Loay"],["Ahd","Angle"],["Desoky","Eslam"]],
[["Kamal","Ahd"],["Eslam","Loay"],["Angle","Seif"]],
[["Kamal","Eslam"],["Seif","Ahd"],["Angle","Desoky"]],
[["Seif","Kamal"],["Ahd","Desoky"],["Angle","Loay"]]];
let peer,conn,isHost=false,myName="",roomCode="",pred={};
const $=id=>document.getElementById(id);
function safe(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function create(){
 myName=$("name").value.trim(); roomCode=$("room").value.trim().toUpperCase();
 if(!myName||!roomCode)return $("status").textContent="اكتب اسمك وكود الروم.";
 isHost=true; $("status").textContent="جاري إنشاء الروم...";
 peer=new Peer("fc27-"+roomCode,{debug:0});
 peer.on("open",()=>{isHost=true;enter();});
 peer.on("connection",c=>{conn=c;setupConn();});
 peer.on("error",e=>{
   if(e.type==="unavailable-id"){isHost=false;peer.destroy();peer=new Peer();peer.on("open",()=>{conn=peer.connect("fc27-"+roomCode);setupConn();enter();});}
   else $("status").textContent="تعذر الاتصال: "+e.type;
 });
}
function enter(){$("login").classList.add("hide");$("app").classList.remove("hide");$("roomTitle").textContent="Room: "+roomCode;$("role").textContent=isHost?"HOST":"PLAYER";render();}
function setupConn(){
 conn.on("open",()=>{ $("peer").textContent="متصل ✓"; send({type:"hello",name:myName}); send({type:"sync",name:myName,pred});});
 conn.on("data",d=>{if(d.type==="hello"){$("peer").textContent="متصل: "+safe(d.name);renderPlayers(d.name)} if(d.type==="sync"){if(d.pred){window.remotePred=d.pred;window.remoteName=d.name;renderPlayers(d.name)}}});
 conn.on("close",()=>{$("peer").textContent="غير متصل";});
}
function send(d){if(conn&&conn.open)conn.send(d)}
function render(){
 let out="";
 rounds.forEach((ms,r)=>{out+=`<div class="card round"><div class="row"><h2 style="margin:0">Round ${r+1}</h2><span class="badge">${r<7?"First Leg":"Return Leg"}</span></div>`;
 ms.forEach((x,m)=>{let id=r+"-"+m,v=pred[id]||["",""];out+=`<div class="match"><div class="team home">${x[0]}<small style="display:block;color:#719086">HOME</small></div><div class="center"><input class="score" id="a${id}" type="number" min="0" value="${v[0]}"> : <input class="score" id="b${id}" type="number" min="0" value="${v[1]}"></div><div class="team away">${x[1]}<small style="display:block;color:#719086">AWAY</small></div></div>`});out+="</div>"});
 $("rounds").innerHTML=out;
}
function collect(){rounds.forEach((ms,r)=>ms.forEach((x,m)=>{let id=r+"-"+m,a=$("a"+id).value,b=$("b"+id).value;if(a!==""&&b!=="")pred[id]=[+a,+b]}));}
function sendAll(){collect();send({type:"sync",name:myName,pred});$("status").textContent="تم إرسال التوقعات ✓";}
function renderPlayers(n){$("players").innerHTML=`<div>👤 ${safe(myName)} — متصل</div><div>👤 ${safe(n)} — متصل</div>`}
function copyInvite(){navigator.clipboard?.writeText(roomCode);alert("كود الروم: "+roomCode)}
</script></body></html>
