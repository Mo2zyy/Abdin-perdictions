<script>
  const SUPABASE_URL = 'https://ffdltukfzqxqrcpvrxxe.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZGx0dWtmenF4cXJjcHZyeHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDc5NDQsImV4cCI6MjEwNTgyMzk0NH0.utVnf2aOG9yxRZoYlAoziDH_LY3Bvd3KkkmcwdY-IoY';
  
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Deadlines لكل يوم
  const DEADLINES = {
    1: new Date('2026-09-25T17:00:00+02:00'), // Day 1: Friday 25/09/2026 at 5:00 PM
    2: new Date('2026-09-26T17:00:00+02:00')  // Day 2: Saturday 26/09/2026 at 5:00 PM
  };

  const TEAM_LOGOS = {
    'Ahd': './ahd.jpeg',
    'Angle': './angle.jpeg',
    'Desoky': './desoky.jpeg',
    'Eslam': './eslam.jpeg',
    'Kamal': './kamal.jpeg',
    'Loay': './loay.jpeg',
    'Seif': './seif.jpeg'
  };

  let currentUser = localStorage.getItem('eafc_user') || '';
  let allMatches = [];
  let userPredictions = {};

  window.onload = () => {
    if (currentUser) {
      showApp();
    } else {
      document.getElementById('login-container').style.display = 'block';
    }
  };

  function loginUser() {
    const input = document.getElementById('username-input').value.trim();
    if (!input) {
      alert('Please enter your name');
      return;
    }
    currentUser = input;
    localStorage.setItem('eafc_user', currentUser);
    showApp();
  }

  function logoutUser() {
    localStorage.removeItem('eafc_user');
    currentUser = '';
    document.getElementById('app-container').style.display = 'none';
    document.getElementById('login-container').style.display = 'block';
  }

  async function showApp() {
    document.getElementById('login-container').style.display = 'none';
    document.getElementById('app-container').style.display = 'block';
    document.getElementById('current-username').innerText = currentUser;
    await loadData();
  }

  async function loadData() {
    try {
      const { data: matches } = await db.from('matches').select('*').order('id', { ascending: true });
      allMatches = matches || [];

      const { data: preds } = await db.from('predictions').select('*').eq('username', currentUser);
      userPredictions = {};
      if (preds) {
        preds.forEach(p => {
          userPredictions[p.match_id] = p;
        });
      }

      renderMatches();
    } catch (err) {
      console.error(err);
    }
  }

  // معرفة اليوم من رقم الجولة
  function getDayFromRound(roundNo) {
    return roundNo <= 7 ? 1 : 2;
  }

  function renderMatches() {
    const now = new Date();
    let html = '';

    // تجميع المباريات حسب اليوم (Day 1 / Day 2) ثم حسب الجولات (Rounds)
    const days = { 1: {}, 2: {} };

    allMatches.forEach(m => {
      const r = m.round_no || 1;
      const day = getDayFromRound(r);
      
      if (!days[day][r]) days[day][r] = [];
      days[day][r].push(m);
    });

    [1, 2].forEach(dayNumber => {
      const deadline = DEADLINES[dayNumber];
      const isClosed = now > deadline;
      const deadlineStr = deadline.toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });

      html += `
        <div class="day-section" style="border-left-width: 6px; margin-top: 40px;">
          <div class="day-header">
            <h2 class="day-title" style="font-size: 1.6rem;">📅 DAY ${dayNumber} ${dayNumber === 1 ? '(FIRST LEG)' : '(RETURN LEG)'}</h2>
            <span class="deadline-badge ${isClosed ? 'deadline-closed' : 'deadline-active'}">
              ${isClosed ? '🔒 Day Closed' : `⏰ Deadline: ${deadlineStr}`}
            </span>
          </div>
        </div>
      `;

      const roundsInDay = days[dayNumber];
      Object.keys(roundsInDay).forEach(r => {
        html += `<h3 style="color:var(--accent-green); margin:20px 0 10px 0; border-bottom:1px solid var(--border-color); padding-bottom:5px;">Round ${r}</h3>`;

        roundsInDay[r].forEach(m => {
          const p = userPredictions[m.id] || {};
          const homeScore = p.home_pred !== undefined && p.home_pred !== null ? p.home_pred : '';
          const awayScore = p.away_pred !== undefined && p.away_pred !== null ? p.away_pred : '';

          const hLogo = TEAM_LOGOS[m.home_team] ? `<img src="${TEAM_LOGOS[m.home_team]}" class="team-logo">` : '';
          const aLogo = TEAM_LOGOS[m.away_team] ? `<img src="${TEAM_LOGOS[m.away_team]}" class="team-logo">` : '';

          html += `
            <div class="match-card">
              <div class="team-cell">
                ${hLogo} <span>${m.home_team}</span>
              </div>
              <div class="pred-inputs">
                <input type="number" min="0" max="20" class="pred-input" id="pred-home-${m.id}" value="${homeScore}" ${isClosed ? 'disabled' : ''}>
                <span>-</span>
                <input type="number" min="0" max="20" class="pred-input" id="pred-away-${m.id}" value="${awayScore}" ${isClosed ? 'disabled' : ''}>
              </div>
              <div class="team-cell away">
                <span>${m.away_team}</span> ${aLogo}
              </div>
            </div>
          `;
        });
      });
    });

    document.getElementById('predictions-form').innerHTML = html;
  }

  async function savePredictions() {
    const now = new Date();
    const updates = [];

    allMatches.forEach(m => {
      const r = m.round_no || 1;
      const day = getDayFromRound(r);
      const deadline = DEADLINES[day];

      // يتخطى الحفظ إذا انتهى الـ Deadline لهذا اليوم
      if (now > deadline) return;

      const hInput = document.getElementById(`pred-home-${m.id}`);
      const aInput = document.getElementById(`pred-away-${m.id}`);

      if (hInput && aInput && hInput.value !== '' && aInput.value !== '') {
        updates.push({
          username: currentUser,
          match_id: m.id,
          home_pred: parseInt(hInput.value),
          away_pred: parseInt(aInput.value)
        });
      }
    });

    if (updates.length === 0) {
      showToast('No active predictions to save!');
      return;
    }

    const { error } = await db.from('predictions').upsert(updates, { onConflict: 'username,match_id' });

    if (error) {
      alert('Error saving: ' + error.message);
    } else {
      showToast('Predictions Saved Successfully!');
      await loadData();
    }
  }

  function sharePredictions() {
    let shareText = `⚽ *ULTIMATE TEAM LEAGUE PREDICTIONS*\n👤 Player: *${currentUser}*\n━━━━━━━━━━━━━━━━━━\n`;

    const days = { 1: {}, 2: {} };
    allMatches.forEach(m => {
      const r = m.round_no || 1;
      const day = getDayFromRound(r);
      if (!days[day][r]) days[day][r] = [];
      days[day][r].push(m);
    });

    [1, 2].forEach(dayNumber => {
      shareText += `\n📅 *DAY ${dayNumber} ${dayNumber === 1 ? '(FIRST LEG)' : '(RETURN LEG)'}*\n`;
      const roundsInDay = days[dayNumber];
      
      Object.keys(roundsInDay).forEach(r => {
        shareText += `*Round ${r}:*\n`;
        roundsInDay[r].forEach(m => {
          const hInput = document.getElementById(`pred-home-${m.id}`);
          const aInput = document.getElementById(`pred-away-${m.id}`);
          const hVal = hInput ? hInput.value : '-';
          const aVal = aInput ? aInput.value : '-';

          shareText += `• ${m.home_team} [ ${hVal !== '' ? hVal : '?'} - ${aVal !== '' ? aVal : '?'} ] ${m.away_team}\n`;
        });
      });
    });

    shareText += `\n🔥 Good Luck Everyone!`;

    navigator.clipboard.writeText(shareText).then(() => {
      showToast('Copied to Clipboard! Ready to share.');
    }).catch(err => {
      console.error('Copy failed', err);
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.className = 'show';
    setTimeout(() => { t.className = t.className.replace('show', ''); }, 3000);
  }
</script>
