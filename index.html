<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTIMATE TEAM LEAGUE - Standings</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg-dark: #0a0e14;
      --card-bg: rgba(18, 24, 36, 0.90);
      --accent-green: #00ff87;
      --text-white: #f8fafc;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); margin: 0; padding: 20px; position: relative; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
    
    h1 { text-align: center; color: var(--text-white); font-weight: 900; letter-spacing: 1px; font-size: 2.2rem; margin-bottom: 10px; }
    h1 span { color: var(--accent-green); }
    h2 { text-align: center; color: var(--accent-green); margin-bottom: 20px; text-transform: uppercase; font-size: 1.4rem; }
    
    .nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .nav a { color: var(--text-white); text-decoration: none; padding: 10px 18px; background: var(--card-bg); border-radius: 6px; font-weight: bold; border: 1px solid var(--border-color); transition: all 0.2s; font-size: 14px; backdrop-filter: blur(5px); }
    .nav a.active { background: var(--accent-green); color: #000; border-color: var(--accent-green); }
    .nav a:hover:not(.active) { border-color: var(--accent-green); }

    .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; backdrop-filter: blur(10px); }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { background: rgba(6, 9, 14, 0.85); color: var(--accent-green); font-weight: bold; }
    tr:last-child td { border-bottom: none; }
    
    /* صفوف الجدول قابلة للضغط */
    tbody tr { cursor: pointer; transition: background 0.2s, transform 0.1s; }
    tbody tr:hover { background: rgba(0, 255, 135, 0.08); }

    .team-cell { display: flex; align-items: center; gap: 10px; font-weight: bold; text-align: left; }
    .team-logo { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--accent-green); background: #000; object-fit: contain; }

    /* Modal Styles */
    .video-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 9999; }
    .video-content { position: relative; background: #121824; border: 2px solid var(--accent-green); border-radius: 12px; padding: 20px; width: 90%; max-width: 550px; box-shadow: 0 0 30px rgba(0,255,135,0.3); text-align: center; }
    .close-video-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; z-index: 10000; display: flex; justify-content: center; align-items: center; transition: transform 0.2s; }
    .close-video-btn:hover { transform: scale(1.1); background: #dc2626; }
    
    .team-stats-preview img { width: 100%; max-height: 300px; border-radius: 8px; border: 1px solid var(--accent-green); background: #000; object-fit: cover; margin-bottom: 15px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .stat-box { background: #06090e; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; }
    .stat-box span { display: block; font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .stat-box strong { font-size: 18px; color: var(--accent-green); }

    /* Background Slideshow (.jpg) */
    .bg-slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
    .bg-slideshow div { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; animation: slideAnimation 28s infinite; filter: brightness(0.35); }

    .bg-slideshow div:nth-child(1) { background-image: url('./ahd1.jpg'); animation-delay: 0s; }
    .bg-slideshow div:nth-child(2) { background-image: url('./angle2.jpg'); animation-delay: 4s; }
    .bg-slideshow div:nth-child(3) { background-image: url('./desoky3.jpg'); animation-delay: 8s; }
    .bg-slideshow div:nth-child(4) { background-image: url('./eslam4.jpg'); animation-delay: 12s; }
    .bg-slideshow div:nth-child(5) { background-image: url('./kamal5.jpg'); animation-delay: 16s; }
    .bg-slideshow div:nth-child(6) { background-image: url('./loay6.jpg'); animation-delay: 20s; }
    .bg-slideshow div:nth-child(7) { background-image: url('./seif7.jpg'); animation-delay: 24s; }

    @keyframes slideAnimation {
      0% { opacity: 0; } 5% { opacity: 1; } 17% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bg-slideshow">
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>

  <!-- Team Stats & Image Modal -->
  <div id="teamModal" class="video-modal" onclick="closeModalOnBackdrop(event)">
    <div class="video-content" onclick="event.stopPropagation()">
      <button class="close-video-btn" onclick="closeTeamModal()">&times;</button>
      <h3 id="modalTeamName" style="color:var(--accent-green); margin-top:5px; text-transform:uppercase;">Team Stats</h3>
      
      <div class="team-stats-preview">
        <img id="modalTeamImg" src="" alt="Team Custom Image">
      </div>

      <div class="stats-grid">
        <div class="stat-box"><span>Played</span><strong id="m_p">0</strong></div>
        <div class="stat-box"><span>Won</span><strong id="m_w">0</strong></div>
        <div class="stat-box"><span>Drawn</span><strong id="m_d">0</strong></div>
        <div class="stat-box"><span>Lost</span><strong id="m_l">0</strong></div>
        <div class="stat-box"><span>Goal Diff</span><strong id="m_gd">0</strong></div>
        <div class="stat-box"><span>Points</span><strong id="m_pts">0</strong></div>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>ULTIMATE TEAM <span>LEAGUE</span></h1>
    
    <div class="nav">
      <a href="index.html" class="active">Standings</a>
      <a href="predictions.html">Predictions</a>
      <a href="matches.html">Matches</a>
    </div>

    <h2>🏆 LEAGUE TABLE (Click team for stats)</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th style="text-align:left;">Team</th>
            <th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th>
          </tr>
        </thead>
        <tbody id="standings-body">
          <tr><td colspan="8">Loading Standings...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ffdltukfzqxqrcpvrxxe.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZGx0dWtmenF4cXJjcHZyeHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDc5NDQsImV4cCI6MjEwNTgyMzk0NH0.utVnf2aOG9yxRZoYlAoziDH_LY3Bvd3KkkmcwdY-IoY';
    
    let db;
    let globalStandingsData = []; // لتخزين بيانات الفرق لعرضها عند الضغط

    const TEAM_LOGOS = {
      'Ahd': './ahd.png',
      'Angle': './Angle.png',
      'Desoky': './desoky.png',
      'Eslam': './eslam.png',
      'Kamal': 'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg',
      'Loay': 'https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg',
      'Seif': './seif.png'
    };

    // ربط أسماء الفرق بصورهم بصيغة PNG الكبيرة
    const TEAM_CUSTOM_IMAGES = {
      'Ahd': './ahd1.png',
      'Angle': './angle2.png',
      'Desoky': './desoky3.png',
      'Eslam': './eslam4.png',
      'Kamal': './kamal5.png',
      'Loay': './loay6.png',
      'Seif': './seif7.png'
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (window.supabase) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        loadStandings();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeTeamModal();
    });

    async function loadStandings() {
      try {
        if (!db) return;
        const { data: matches } = await db.from('matches').select('*');
        if (!matches) return;

        const stats = {};
        Object.keys(TEAM_LOGOS).forEach(team => {
          stats[team] = { name: team, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
        });

        matches.forEach(m => {
          if (m.home_score !== null && m.home_score !== undefined && m.home_score !== '') {
            const h = m.home_team; const a = m.away_team;
            const hs = parseInt(m.home_score); const as = parseInt(m.away_score);

            if (stats[h] && stats[a]) {
              stats[h].p++; stats[a].p++;
              stats[h].gf += hs; stats[h].ga += as;
              stats[a].gf += as; stats[a].ga += hs;

              if (hs > as) { stats[h].w++; stats[h].pts += 3; stats[a].l++; }
              else if (as > hs) { stats[a].w++; stats[a].pts += 3; stats[h].l++; }
              else { stats[h].d++; stats[h].pts += 1; stats[a].d++; stats[a].pts += 1; }
            }
          }
        });

        let tableArray = Object.values(stats);
        tableArray.forEach(t => t.gd = t.gf - t.ga);
        tableArray.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
        
        globalStandingsData = tableArray; // حفظ البيانات للاستخدام عند الضغط

        let html = '';
        tableArray.forEach((t, i) => {
          const logo = TEAM_LOGOS[t.name] ? `<img src="${TEAM_LOGOS[t.name]}" class="team-logo">` : '';
          html += `
            <tr onclick="openTeamModal('${t.name}')">
              <td>${i + 1}</td>
              <td class="team-cell">${logo} <span>${t.name}</span></td>
              <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
              <td>${t.gd > 0 ? '+' + t.gd : t.gd}</td>
              <td style="font-weight:bold; color:var(--accent-green);">${t.pts}</td>
            </tr>
          `;
        });

        document.getElementById('standings-body').innerHTML = html;
      } catch (err) { console.error(err); }
    }

    function openTeamModal(teamName) {
      const teamData = globalStandingsData.find(t => t.name === teamName);
      if (!teamData) return;

      document.getElementById('modalTeamName').innerText = teamName + ' - Stats';
      document.getElementById('modalTeamImg').src = TEAM_CUSTOM_IMAGES[teamName] || '';

      document.getElementById('m_p').innerText = teamData.p;
      document.getElementById('m_w').innerText = teamData.w;
      document.getElementById('m_d').innerText = teamData.d;
      document.getElementById('m_l').innerText = teamData.l;
      document.getElementById('m_gd').innerText = teamData.gd > 0 ? '+' + teamData.gd : teamData.gd;
      document.getElementById('m_pts').innerText = teamData.pts;

      document.getElementById('teamModal').style.display = 'flex';
    }

    function closeTeamModal() {
      document.getElementById('teamModal').style.display = 'none';
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'teamModal') {
        closeTeamModal();
      }
    }
  </script>
</body>
</html>
