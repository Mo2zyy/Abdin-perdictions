<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTIMATE TEAM LEAGUE - Standings</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg-dark: #0a0e14;
      --card-bg: #121824;
      --accent-green: #00ff87;
      --text-white: #f8fafc;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    h1 { text-align: center; color: var(--text-white); font-weight: 900; letter-spacing: 1px; font-size: 2.2rem; margin-bottom: 10px; }
    h1 span { color: var(--accent-green); }
    h2 { text-align: center; color: var(--accent-green); margin-bottom: 20px; text-transform: uppercase; font-size: 1.4rem; }
    
    /* Navigation Bar */
    .nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .nav a { color: var(--text-white); text-decoration: none; padding: 10px 18px; background: var(--card-bg); border-radius: 6px; font-weight: bold; border: 1px solid var(--border-color); transition: all 0.2s; font-size: 14px; }
    .nav a.active { background: var(--accent-green); color: #000; border-color: var(--accent-green); }
    .nav a:hover:not(.active) { border-color: var(--accent-green); }

    /* Standings Table */
    .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { background: #06090e; color: var(--accent-green); font-weight: bold; }
    tr:last-child td { border-bottom: none; }
    .team-cell { display: flex; align-items: center; gap: 10px; font-weight: bold; text-align: left; }
    .team-logo { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--accent-green); background: #000; object-fit: contain; }

    /* Video Popup Modal */
    .video-modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 9999; }
    .video-content { position: relative; background: var(--card-bg); border: 2px solid var(--accent-green); border-radius: 12px; padding: 20px; width: 90%; max-width: 700px; box-shadow: 0 0 30px rgba(0,255,135,0.3); }
    
    /* زر الإغلاق داخل الكارت */
    .close-video-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; z-index: 10000; display: flex; justify-content: center; align-items: center; transition: transform 0.2s; }
    .close-video-btn:hover { transform: scale(1.1); background: #dc2626; }
    
    /* Overlay Button for Sound Guarantee */
    .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 8px; z-index: 10; cursor: pointer; }
    .play-btn { background: var(--accent-green); color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,135,0.6); transition: transform 0.2s; }
    .play-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <!-- Video Popup Modal (يغلق عند الضغط خارج الكارت) -->
  <div id="videoModal" class="video-modal" onclick="closeVideoOnBackdrop(event)">
    <div class="video-content" onclick="event.stopPropagation()">
      <button class="close-video-btn" onclick="closeVideo()">&times;</button>
      
      <div style="position: relative; margin-top: 15px;">
        <!-- زر التغلب على حظر الصوت -->
        <div id="playOverlay" class="play-overlay" onclick="startVideoWithSound()">
          <button class="play-btn">🔊 Watch Intro With Sound</button>
        </div>

        <video id="promoVideo" controls style="width:100%; display:block; border-radius:8px;">
          <source src="intro.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>ULTIMATE TEAM <span>LEAGUE</span></h1>
    
    <div class="nav">
      <a href="index.html" class="active">Standings</a>
      <a href="predictions.html">Predictions</a>
      <a href="matches.html">Matches</a>
    </div>

    <h2>🏆 LEAGUE TABLE</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th style="text-align:left;">Team</th>
            <th>P</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>GD</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody id="standings-body">
          <tr><td colspan="8">Loading Standings...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ffdltukfzqxqrcpvrxxe.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZGx0dWtmenF4cXJjcHZyeHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDc5NDQsImV4cCI6MjEwNTgyMzk0NH0.utVnf2aOG9yxRZoYlAoziDH_LY3Bvd3KkkmcwdY-IoY';
    
    let db;

    const TEAM_LOGOS = {
  'Ahd': './ahd.png',
  'Angle': './Angle.png',
  'Desoky': './desoky.png',
  'Eslam': './eslam.png',
  'Kamal': 'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg',
  'Loay': 'https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg',
  'Seif': './seif.png'
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (window.supabase) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        loadStandings();
      }
    });

    // إغلاق الفيديو بزرار ESC من الكيبورد
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeVideo();
      }
    });

    function startVideoWithSound() {
      const video = document.getElementById('promoVideo');
      const overlay = document.getElementById('playOverlay');
      if (video) {
        video.muted = false;
        video.play();
        overlay.style.display = 'none';
      }
    }

    async function loadStandings() {
      try {
        if (!db) return;
        const { data: matches } = await db.from('matches').select('*');
        if (!matches) return;

        const stats = {};
        Object.keys(TEAM_LOGOS).forEach(team => {
          stats[team] = { name: team, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
        });

        matches.forEach(m => {
          if (m.home_score !== null && m.away_score !== null && m.home_score !== undefined) {
            const h = m.home_team;
            const a = m.away_team;
            const hs = parseInt(m.home_score);
            const as = parseInt(m.away_score);

            if (stats[h] && stats[a]) {
              stats[h].p++; stats[a].p++;
              stats[h].gf += hs; stats[h].ga += as;
              stats[a].gf += as; stats[a].ga += hs;

              if (hs > as) {
                stats[h].w++; stats[h].pts += 3;
                stats[a].l++;
              } else if (as > hs) {
                stats[a].w++; stats[a].pts += 3;
                stats[h].l++;
              } else {
                stats[h].d++; stats[h].pts += 1;
                stats[a].d++; stats[a].pts += 1;
              }
            }
          }
        });

        let tableArray = Object.values(stats);
        tableArray.forEach(t => t.gd = t.gf - t.ga);

        tableArray.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);

        let html = '';
        tableArray.forEach((t, i) => {
          const logo = TEAM_LOGOS[t.name] ? `<img src="${TEAM_LOGOS[t.name]}" class="team-logo">` : '';
          html += `
            <tr>
              <td>${i + 1}</td>
              <td class="team-cell">${logo} <span>${t.name}</span></td>
              <td>${t.p}</td>
              <td>${t.w}</td>
              <td>${t.d}</td>
              <td>${t.l}</td>
              <td>${t.gd > 0 ? '+' + t.gd : t.gd}</td>
              <td style="font-weight:bold; color:var(--accent-green);">${t.pts}</td>
            </tr>
          `;
        });

        document.getElementById('standings-body').innerHTML = html;

      } catch (err) {
        console.error(err);
      }
    }

    function closeVideo() {
      const vid = document.getElementById('promoVideo');
      if (vid) vid.pause();
      document.getElementById('videoModal').style.display = 'none';
    }

    function closeVideoOnBackdrop(e) {
      if (e.target.id === 'videoModal') {
        closeVideo();
      }
    }
  </script>
</body>
</html>
