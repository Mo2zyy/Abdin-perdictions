<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توقعات Ultimate Team League</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    input[type="text"] { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; }
    input[type="number"] { width: 50px; padding: 8px; text-align: center; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 18px; font-weight: bold; }
    button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; margin-top: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #0369a1; }
    .match-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    .player-name { font-weight: bold; width: 35%; text-align: center; font-size: 15px; }
    .save-btn { background: #10b981; }
    .save-btn:hover { background: #059669; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏆 Ultimate Team League</h1>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-sec" class="card">
      <h3 style="margin-bottom: 8px;">دخول المتوقعين</h3>
      <p style="color: #94a3b8; font-size: 14px;">ادخل كود المستخدم أو اسمك:</p>
      <input type="text" id="user-code" placeholder="مثال: Desoky">
      <button onclick="login()">دخول</button>
    </div>

    <!-- شاشة عرض المباريات -->
    <div id="app-sec" style="display:none;">
      <div class="header-bar">
        <h3 id="welcome-msg" style="color:#38bdf8;"></h3>
      </div>
      <div id="matches-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
